plugins { id 'com.android.application' }

android {
    namespace 'com.wizardchess.cathedral'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.wizardchess.cathedral'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The game itself lives in ../../web and is packaged unchanged as the app's assets.
    sourceSets {
        main { assets.srcDirs = ['../../web'] }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            // Configure the owner's signing key before distributing a release build.
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
